<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" href="/images/imgLogo/logoCharvelaes.jpg" type="image/x-icon">
</head>
<body>

<div class="login-page">
    <a href="/index.html" class="btn-back">
        <i class="fa-solid fa-arrow-left"></i>
        Volver al inicio
    </a>
    <div class="login-container">

        <!-- Logo -->
        <div class="login-logo">
            <img
                src="/images/imgLogo/logoCharvelaes.jpg"
                alt="Logo Charvelaes">
        </div>
        <!-- Encabezado -->
        <div class="login-header">
            <h1>
                Bienvenido a <span>Charvelaes</span>
            </h1>
            <p>
                Accede a tu cuenta para disfrutar una experiencia personalizada.
            </p>
        </div>
        <!-- Formulario -->
        <form class="login-form" method="POST">
            <!-- Correo -->
            <div class="input-group">
                <label for="email">
                    Correo Electrónico
                </label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Ingresa tu correo"
                        required>
                </div>
            </div>
            <!-- Contraseña -->
            <div class="input-group">
                <label for="password">
                    Contraseña
                </label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required>
                </div>
            </div>
            <!-- Opciones -->
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox">
                    <span>Recordarme</span>
                </label>
                <a href="#" class="forgot-password">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>
            <!-- Botón -->
            <button
                type="submit"
                class="boton-login">
                Ingresar
            </button>
        </form>
        <!-- Registro -->
        <div class="login-footer">
            <p>
                ¿No tienes una cuenta?
                <a href="register.html">
                    Regístrate aquí
                </a>
            </p>
        </div>
    </div>
</div>

</body>
</html>
