<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="icon" href="/images/imgLogo/logoCharvelaes.jpg" type="image/x-icon">
</head>
<body>
    <div class="login-page">

        <a href="/index.html" class="btn-back">
            Volver al inicio
        </a>

        <div class="login-container">
            <div class="login-header">
                <h1>Bienvenido a <span>Charvelaes</span></h1>
                <p>Accede a tu cuenta para gestionar pedidos y disfrutar una experiencia personalizada.</p>
            </div>
            <form class="login-form">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="Ingresa tu correo" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div class="form-actions">
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>
                <button type="submit" class="boton-login">Ingresar</button>
            </form>
            <div class="login-footer">
                <p>¿No tienes una cuenta? <a href="register.html">Regístrate aquí</a></p>
            </div>
        </div>

    </div>
</body>
</html>
