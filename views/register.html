<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse — Charvelaes</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" href="/images/imgLogo/logoCharvelaes.jpg" type="image/x-icon">
</head>
<body>

<div class="login-page">
    <a href="/index.html" class="btn-back">
        <i class="fa-solid fa-arrow-left"></i>
        Volver al inicio
    </a>

<div class="login-container">

    <div class="login-logo">
        <img
            src="/images/imgLogo/logoCharvelaes.jpg"
            alt="Logo Charvelaes">
    </div>

    <div class="login-header">
        <h1>Crear cuenta en <span>Charvelaes</span></h1>
        <p>
            Regístrate para disfrutar una experiencia personalizada.
        </p>
    </div>

    <form class="login-form" action="" method="POST">

        <div class="input-group">
            <label for="name">Nombre</label>

            <div class="input-wrapper">
                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Ingresa tu nombre"
                    required>
            </div>
        </div>

        <div class="input-group">
            <label for="email">Correo electrónico</label>

            <div class="input-wrapper">
                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Ingresa un correo"
                    required>
            </div>
        </div>

        <div class="input-group">
            <label for="password">Contraseña</label>

            <div class="input-wrapper">
                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa una contraseña"
                    required>
            </div>
        </div>

        <div class="input-group">
            <label for="confirm-password">Confirmar contraseña</label>

            <div class="input-wrapper">
                <i class="fa-solid fa-shield-halved"></i>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm_password"
                    placeholder="Repite tu contraseña"
                    required>
            </div>
        </div>

        <div class="checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" name="terms" required>

                <span>
                    Acepto los
                    <a href="#">términos y condiciones</a>
                </span>
            </label>
        </div>

        <button type="submit" class="boton-login">
            Crear cuenta
        </button>

    </form>

    <div class="login-footer">
        <p>
            ¿Ya tienes una cuenta?
            <a href="login.html">Iniciar sesión</a>
        </p>
    </div>

    </div>
</div>
</body>
</html>
