<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse — Charvelaes</title>
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="icon" href="/images/imgLogo/logoCharvelaes.jpg" type="image/x-icon">
</head>
<body>

    <div class="login-page">

        <a href="/index.html" class="btn-back">
            Volver al inicio
        </a>

        <div class="login-container">

            <div class="login-header">
                <h1>Crear cuenta en <span>Charvelaes</span></h1>
                <p>Regístrate para gestionar pedidos y disfrutar una experiencia personalizada.</p>
            </div>

            <form class="login-form" action="" method="POST">

                <div class="input-group">
                    <label for="name">Nombre completo</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Ingresa tu nombre"
                        required
                        autocomplete="name"
                    >
                </div>

                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Ingresa un correo"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa una contraseña"
                        required
                        minlength="8"
                        autocomplete="new-password"
                    >
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        placeholder="Repite tu contraseña"
                        required
                        minlength="8"
                        autocomplete="new-password"
                    >
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="terms" required>
                        <span>
                            Acepto los
                            <a href="/terminos.html" target="_blank" rel="noopener">términos y condiciones</a>
                        </span>
                    </label>
                </div>

                <button type="submit" class="boton-login">Crear cuenta</button>

            </form>

            <div class="login-footer">
                <p>¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a></p>
            </div>

        </div>

    </div>

</body>
</html>
